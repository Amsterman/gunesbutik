<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yönetim Paneli | Güneş Aksesuar &amp; Parfüm</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-shell">

<section id="login-section" class="login-shell">
  <h1>Yönetim Paneline Giriş</h1>
  <form id="login-form">
    <div class="field">
      <label for="login-email">E-posta</label>
      <input id="login-email" name="email" type="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="login-password">Şifre</label>
      <input id="login-password" name="password" type="password" required autocomplete="current-password">
    </div>
    <p id="login-error" class="error-note" hidden></p>
    <button type="submit" class="primary-btn">Giriş Yap</button>
  </form>
</section>

<section id="panel-section" hidden>
  <div class="wrap">
    <div class="admin-header">
      <h1>Ürün Yönetimi</h1>
      <button id="logout-btn" class="text-btn" type="button">Çıkış yap</button>
    </div>

    <div class="admin-grid">
      <div class="admin-form-card">
        <h2 id="form-title">Yeni Ürün Ekle</h2>
        <form id="product-form">
          <div class="field">
            <label for="p-name">Ürün adı</label>
            <input id="p-name" name="name" type="text" required>
          </div>
          <div class="field">
            <label for="p-category">Ana kategori</label>
            <select id="p-category" name="category" required></select>
          </div>
          <fieldset class="tag-fieldset">
            <legend>Özel koleksiyonlar</legend>
            <div id="tag-options" class="tag-options"></div>
          </fieldset>
          <div class="field">
            <label for="p-price">Fiyat (opsiyonel)</label>
            <input id="p-price" name="price" type="text" placeholder="Örn: 350 TL">
          </div>
          <div class="field">
            <label for="p-description">Kısa açıklama (opsiyonel)</label>
            <textarea id="p-description" name="description" placeholder="Örn: 50ml, odunsu kokular seven kişiler için"></textarea>
          </div>
          <div class="field">
            <label for="p-image">Fotoğraf</label>
            <input id="p-image" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
          </div>
          <div class="form-actions">
            <button id="submit-btn" type="submit" class="primary-btn">Ürünü Ekle</button>
            <button id="cancel-edit-btn" class="text-btn" type="button" hidden>Vazgeç</button>
          </div>
        </form>
      </div>

      <div>
        <div id="product-list" class="admin-list"></div>
      </div>
    </div>

    <section id="visitor-stats" class="admin-form-card" style="margin-top:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
        <div>
          <h2 style="margin:0 0 6px;">Ziyaretçi İstatistikleri</h2>
          <p style="margin:0;">Aynı tarayıcı aynı gün içinde yalnızca 1 kez sayılır.</p>
        </div>
        <button id="refresh-stats-btn" class="primary-btn" type="button">Yenile</button>
      </div>

      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px;">
        <div style="padding:16px;border:1px solid #ddd;border-radius:12px;">
          <small>Bugün</small>
          <strong id="stats-today" style="display:block;font-size:28px;margin-top:4px;">-</strong>
        </div>
        <div style="padding:16px;border:1px solid #ddd;border-radius:12px;">
          <small>Bu hafta</small>
          <strong id="stats-week" style="display:block;font-size:28px;margin-top:4px;">-</strong>
        </div>
        <div style="padding:16px;border:1px solid #ddd;border-radius:12px;">
          <small>Bu ay</small>
          <strong id="stats-month" style="display:block;font-size:28px;margin-top:4px;">-</strong>
        </div>
        <div style="padding:16px;border:1px solid #ddd;border-radius:12px;">
          <small>Toplam</small>
          <strong id="stats-total" style="display:block;font-size:28px;margin-top:4px;">-</strong>
        </div>
      </div>
      <p id="stats-status" style="margin:14px 0 0;"></p>

      <div class="admin-form-card" style="margin-top:16px;">
        <h3 style="margin-top:0;">Tarih Aralığı Sorgulama</h3>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(140px,1fr));gap:12px;">
          <div class="field">
            <label for="stats-start-date">Başlangıç tarihi</label>
            <input id="stats-start-date" type="date">
          </div>
          <div class="field">
            <label for="stats-end-date">Bitiş tarihi</label>
            <input id="stats-end-date" type="date">
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
          <button id="stats-query-btn" class="primary-btn" type="button">Sorgula</button>
          <button id="stats-clear-btn" class="text-btn" type="button">Temizle</button>
        </div>
        <div style="margin-top:14px;font-size:1.05rem;">
          Seçilen aralık: <strong id="stats-range-result">0</strong> ziyaretçi
        </div>
        <p id="stats-range-status" class="empty-note"></p>
      </div>
    </section>
  </div>
</section>

<script type="module" src="js/admin.js"></script>
</body>
</html>
